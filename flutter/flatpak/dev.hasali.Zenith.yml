id: dev.hasali.Zenith
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zenith
finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
modules:
  - name: zenith
    buildsystem: simple
    build-commands:
      - mkdir -p "${FLATPAK_DEST}/Zenith"
      - cp -r Zenith/. "${FLATPAK_DEST}/Zenith/"
      - chmod +x "${FLATPAK_DEST}/Zenith/zenith"
      - mkdir -p "${FLATPAK_DEST}/bin"
      - mkdir -p "${FLATPAK_DEST}/lib"
      - ln -s "${FLATPAK_DEST}/Zenith/zenith" "${FLATPAK_DEST}/bin/zenith"
    sources:
      - type: dir
        only-arches: [x86_64]
        path: zenith-flutter-linux
        dest: Zenith

  - name: glslang
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_EXTERNAL=OFF
      - -DENABLE_CTEST=OFF
      - -DENABLE_OPT=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/glslang.git
        tag: 16.4.0
        commit: 168d452a4f460d24b588fed08477a81c44ee27a1
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
  - name: fribidi
    buildsystem: meson
    config-opts:
      - -Ddocs=false
    sources:
      - type: git
        url: https://github.com/fribidi/fribidi.git
        tag: v1.0.16
        commit: 68162babff4f39c4e2dc164a5e825af93bda9983
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-fontconfig
      - --disable-require-system-font-provider
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4
        commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dlua=disabled
      - -Ddebug=false
      - -Dbuild-date=false
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dvulkan=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  
  - name: bzip2
    buildsystem: simple
    build-commands:
      - make -f Makefile-libbz2_so
      - install -Dm755 libbz2.so.1.0.8 /app/lib/libbz2.so.1.0.8
      - ln -s libbz2.so.1.0.8 /app/lib/libbz2.so.1.0
      - ln -s libbz2.so.1.0 /app/lib/libbz2.so.1
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - '*.a'
    sources:
      - type: archive
        url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
        sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
        x-checker-data:
          type: anitya
          project-id: 237
